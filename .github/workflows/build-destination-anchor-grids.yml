name: Build destination-anchor interpolation grids

on:
  push:
    branches: [add-destination-interpolation-anchor]
    paths:
      - data/interpolation-anchors.json
      - scripts/build_precomputed_grid.mjs
      - scripts/build_access_grid.mjs
      - .github/workflows/build-destination-anchor-grids.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate build scripts
        run: |
          node --check scripts/build_precomputed_grid.mjs
          node --check scripts/build_access_grid.mjs

      - name: Build IDW grid with destination anchor
        run: node scripts/build_precomputed_grid.mjs

      - name: Build access-aware grid with destination anchor
        run: node scripts/build_access_grid.mjs

      - name: Validate destination anchor provenance
        run: |
          python - <<'PY'
          import hashlib, json, math, struct
          from pathlib import Path

          stations = Path('data/stations.json')
          anchors = Path('data/interpolation-anchors.json')
          station_sha = hashlib.sha256(stations.read_bytes()).hexdigest()
          anchor_sha = hashlib.sha256(anchors.read_bytes()).hexdigest()
          idw = json.loads(Path('data/idw-grid.meta.json').read_text(encoding='utf-8'))
          access = json.loads(Path('data/access-grid.meta.json').read_text(encoding='utf-8'))

          for meta in (idw, access):
              assert meta['stationCount'] == 1563
              assert meta['sourceStationCount'] == 1563
              assert meta['excludedStationCount'] == 0
              assert meta['interpolationAnchorCount'] == 1
              assert meta['interpolationAnchorIds'] == ['destination-tsukufu']
              assert meta['sampleCount'] == 1564
              assert meta['stationDataSha256'] == station_sha
              assert meta['interpolationAnchorDataSha256'] == anchor_sha

          for key in ('rows', 'cols', 'north', 'south', 'west', 'east', 'latStep', 'lngStep', 'scale', 'offsetMinutes', 'nodata'):
              assert access[key] == idw[key]

          anchor = json.loads(anchors.read_text(encoding='utf-8'))['anchors'][0]
          def sample(base, meta):
              raw = Path(base + '.bin').read_bytes()
              values = struct.unpack('<' + 'H' * (len(raw) // 2), raw)
              row = (meta['north'] - anchor['lat']) / meta['latStep']
              col = (anchor['lng'] - meta['west']) / meta['lngStep']
              r0 = max(0, min(meta['rows'] - 2, math.floor(row)))
              c0 = max(0, min(meta['cols'] - 2, math.floor(col)))
              fr = max(0.0, min(1.0, row - r0))
              fc = max(0.0, min(1.0, col - c0))
              i = r0 * meta['cols'] + c0
              v00, v10 = values[i], values[i + 1]
              v01, v11 = values[i + meta['cols']], values[i + meta['cols'] + 1]
              top = v00 + (v10 - v00) * fc
              bottom = v01 + (v11 - v01) * fc
              encoded = top + (bottom - top) * fr
              return encoded / meta['scale'] - meta['offsetMinutes']

          print('destination target', anchor['minutes'])
          print('IDW sampled at destination', sample('data/idw-grid', idw))
          print('access sampled at destination', sample('data/access-grid', access))
          PY

      - name: Commit generated grids
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/idw-grid.bin data/idw-grid.bin.gz data/idw-grid.meta.json \
            data/access-grid.bin data/access-grid.bin.gz data/access-grid.meta.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Regenerate grids with school destination anchor'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
