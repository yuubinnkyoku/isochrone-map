name: Build access-aware interpolation grid

on:
  push:
    branches: [add-access-aware-interpolation]
    paths:
      - scripts/build_access_grid.mjs
      - .github/workflows/build-access-grid.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript before the expensive build
        run: |
          node --check scripts/build_access_grid.mjs
          node --check js/precomputed-grid.js
          node --check js/ui.js
          node --check js/main.js

      - name: Build access-aware grid
        run: node scripts/build_access_grid.mjs

      - name: Validate grid compatibility and provenance
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          stations = Path('data/stations.json')
          access = json.loads(Path('data/access-grid.meta.json').read_text(encoding='utf-8'))
          idw = json.loads(Path('data/idw-grid.meta.json').read_text(encoding='utf-8'))
          sha = hashlib.sha256(stations.read_bytes()).hexdigest()

          assert access['stationCount'] == 1563, access
          assert access['sourceStationCount'] == 1563, access
          assert access['excludedStationCount'] == 0, access
          assert access['stationDataSha256'] == sha, (access['stationDataSha256'], sha)
          for key in ('rows', 'cols', 'north', 'south', 'west', 'east', 'latStep', 'lngStep', 'scale', 'offsetMinutes', 'nodata'):
              assert access[key] == idw[key], (key, access[key], idw[key])
          expected = access['rows'] * access['cols'] * 2
          assert Path('data/access-grid.bin').stat().st_size == expected
          assert Path('data/access-grid.bin.gz').stat().st_size > 0
          assert access['walkingSpeedMetersPerMinute'] == 80
          assert access['streetDetourFactor'] == 1.25
          print(json.dumps(access, ensure_ascii=False, indent=2))
          PY

      - name: Commit generated grid to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/access-grid.bin data/access-grid.bin.gz data/access-grid.meta.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Generate access-aware interpolation grid'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
