name: Format route tooltip lines

on:
  push:
    branches: [format-route-tooltip-lines]
    paths:
      - .github/workflows/format-route-tooltip-lines.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Format route tooltip into readable lines
        run: |
          python - <<'PY'
          from pathlib import Path

          markers = Path('js/markers.js')
          text = markers.read_text(encoding='utf-8')
          old = "        var routeHtml = s.route ? '<div class=\"tt-line\">' + s.route + '</div>' : '';"
          new = """        var routeHtml = '';
          if (s.route) {
            var routeParts = String(s.route).split(' → ');
            var routeLines = [];
            for (var routeIndex = 0; routeIndex < routeParts.length; routeIndex += 2) {
              var routeLine = routeParts.slice(routeIndex, routeIndex + 2).join(' → ');
              if (routeIndex > 0) routeLine = '→ ' + routeLine;
              routeLines.push(routeLine);
            }
            routeHtml = '<div class=\"tt-line tt-route\">' + routeLines.join('<br>') + '</div>';
          }"""
          assert old in text
          markers.write_text(text.replace(old, new, 1), encoding='utf-8')

          style = Path('css/style.css')
          text = style.read_text(encoding='utf-8')
          old = """.tt-line {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.5;
          }
          """
          new = old + """
          .tt-route {
            max-width: min(360px, calc(100vw - 48px));
            white-space: normal;
            line-height: 1.65;
          }
          """
          assert old in text
          style.write_text(text.replace(old, new, 1), encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          assert 'css/style.css?v=3' in text
          assert 'js/markers.js?v=17' in text
          text = text.replace('css/style.css?v=3', 'css/style.css?v=4', 1)
          text = text.replace('js/markers.js?v=17', 'js/markers.js?v=18', 1)
          index.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript and formatting
        run: |
          node --check js/markers.js
          python - <<'PY'
          from pathlib import Path
          markers = Path('js/markers.js').read_text(encoding='utf-8')
          style = Path('css/style.css').read_text(encoding='utf-8')
          assert "routeParts = String(s.route).split(' → ')" in markers
          assert "routeLines.join('<br>')" in markers
          assert '.tt-route {' in style
          print('route tooltip line formatting validated')
          PY

      - name: Commit route tooltip formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/format-route-tooltip-lines.yml
          git add js/markers.js css/style.css index.html
          git commit -m 'Format route tooltips across readable lines'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
