name: Validate physical station dataset

on:
  pull_request:
    branches: [main]
    paths:
      - data/stations.json
      - data/idw-grid.bin
      - data/idw-grid.bin.gz
      - data/idw-grid.meta.json
      - data/access-grid.bin
      - data/access-grid.bin.gz
      - data/access-grid.meta.json
      - scripts/prepare_physical_station_points.py
      - scripts/validate_physical_station_dataset.py
      - scripts/build_physical_station_dataset.py
      - scripts/build_precomputed_grid.mjs
      - scripts/build_access_grid.mjs
      - js/config.js
      - js/precomputed-grid.js
      - js/main.js
      - js/markers.js
      - js/ui.js
      - index.html
      - .github/workflows/validate-physical-stations.yml
  push:
    branches: [main]
    paths:
      - data/stations.json
      - data/idw-grid.bin
      - data/idw-grid.bin.gz
      - data/idw-grid.meta.json
      - data/access-grid.bin
      - data/access-grid.bin.gz
      - data/access-grid.meta.json
      - scripts/prepare_physical_station_points.py
      - scripts/validate_physical_station_dataset.py
      - scripts/build_physical_station_dataset.py
      - scripts/build_precomputed_grid.mjs
      - scripts/build_access_grid.mjs
      - js/config.js
      - js/precomputed-grid.js
      - js/main.js
      - js/markers.js
      - js/ui.js
      - index.html
      - .github/workflows/validate-physical-stations.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild physical-point proposal from current dataset
        run: python scripts/prepare_physical_station_points.py
      - name: Validate station model
        run: python scripts/validate_physical_station_dataset.py
      - name: Validate interpolation metadata and station hash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          stations = Path('data/stations.json')
          sha = hashlib.sha256(stations.read_bytes()).hexdigest()
          idw = json.loads(Path('data/idw-grid.meta.json').read_text(encoding='utf-8'))
          access = json.loads(Path('data/access-grid.meta.json').read_text(encoding='utf-8'))

          for meta in (idw, access):
              assert meta['stationCount'] == 1563
              assert meta['sourceStationCount'] == 1563
              assert meta['excludedStationCount'] == 0
              assert meta['stationDataSha256'] == sha, (meta['stationDataSha256'], sha)

          for key in ('rows', 'cols', 'north', 'south', 'west', 'east', 'latStep', 'lngStep', 'scale', 'offsetMinutes', 'nodata'):
              assert access[key] == idw[key], (key, access[key], idw[key])
          assert access['mode'] == 'access'
          assert access['walkingSpeedMetersPerMinute'] == 80
          assert access['streetDetourFactor'] == 1.25
          assert Path('data/access-grid.bin').stat().st_size == access['rows'] * access['cols'] * 2
          assert Path('data/access-grid.bin.gz').stat().st_size > 0

          print('stationDataSha256', sha)
          print('grid', idw['rows'], idw['cols'])
          print('access effective straight-line speed', access['effectiveStraightLineSpeedMetersPerMinute'], 'm/min')
          PY
      - name: Validate JavaScript syntax
        run: |
          node --check scripts/build_access_grid.mjs
          node --check js/config.js
          node --check js/precomputed-grid.js
          node --check js/main.js
          node --check js/markers.js
          node --check js/ui.js
