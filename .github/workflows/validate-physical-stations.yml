name: Validate physical station dataset

on:
  pull_request:
    branches: [main]
    paths:
      - data/stations.json
      - data/interpolation-anchors.json
      - data/idw-grid.bin
      - data/idw-grid.bin.gz
      - data/idw-grid.meta.json
      - data/access-grid.bin
      - data/access-grid.bin.gz
      - data/access-grid.meta.json
      - scripts/prepare_physical_station_points.py
      - scripts/validate_physical_station_dataset.py
      - scripts/build_physical_station_dataset.py
      - scripts/build_precomputed_grid.mjs
      - scripts/build_access_grid.mjs
      - js/config.js
      - js/precomputed-grid.js
      - js/main.js
      - js/markers.js
      - js/ui.js
      - index.html
      - .github/workflows/validate-physical-stations.yml
  push:
    branches: [main]
    paths:
      - data/stations.json
      - data/interpolation-anchors.json
      - data/idw-grid.bin
      - data/idw-grid.bin.gz
      - data/idw-grid.meta.json
      - data/access-grid.bin
      - data/access-grid.bin.gz
      - data/access-grid.meta.json
      - scripts/prepare_physical_station_points.py
      - scripts/validate_physical_station_dataset.py
      - scripts/build_physical_station_dataset.py
      - scripts/build_precomputed_grid.mjs
      - scripts/build_access_grid.mjs
      - js/config.js
      - js/precomputed-grid.js
      - js/main.js
      - js/markers.js
      - js/ui.js
      - index.html
      - .github/workflows/validate-physical-stations.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild physical-point proposal from current dataset
        run: python scripts/prepare_physical_station_points.py
      - name: Validate station model
        run: python scripts/validate_physical_station_dataset.py
      - name: Validate interpolation metadata and anchor hashes
        run: |
          python - <<'PY'
          import hashlib, json, math, statistics, sys
          from pathlib import Path

          assert sys.byteorder == 'little'
          stations_path = Path('data/stations.json')
          anchors_path = Path('data/interpolation-anchors.json')
          stations_doc = json.loads(stations_path.read_text(encoding='utf-8'))
          anchors_doc = json.loads(anchors_path.read_text(encoding='utf-8'))
          station_sha = hashlib.sha256(stations_path.read_bytes()).hexdigest()
          anchor_sha = hashlib.sha256(anchors_path.read_bytes()).hexdigest()
          idw = json.loads(Path('data/idw-grid.meta.json').read_text(encoding='utf-8'))
          access = json.loads(Path('data/access-grid.meta.json').read_text(encoding='utf-8'))

          assert len(anchors_doc['anchors']) == 1
          school = anchors_doc['anchors'][0]
          assert school['id'] == 'destination-tsukufu'
          assert school['kind'] == 'destination'
          assert school['lat'] == 35.716741
          assert school['lng'] == 139.7308823
          assert school['minutes'] == 498

          for meta in (idw, access):
              assert meta['stationCount'] == 1563
              assert meta['sourceStationCount'] == 1563
              assert meta['excludedStationCount'] == 0
              assert meta['interpolationAnchorCount'] == 1
              assert meta['interpolationAnchorIds'] == ['destination-tsukufu']
              assert meta['sampleCount'] == 1564
              assert meta['gridAlignmentAnchorId'] == 'destination-tsukufu'
              assert meta['stationDataSha256'] == station_sha, (meta['stationDataSha256'], station_sha)
              assert meta['interpolationAnchorDataSha256'] == anchor_sha, (meta['interpolationAnchorDataSha256'], anchor_sha)

          for key in ('rows', 'cols', 'north', 'south', 'west', 'east', 'latStep', 'lngStep', 'scale', 'offsetMinutes', 'nodata'):
              assert access[key] == idw[key], (key, access[key], idw[key])
          assert access['mode'] == 'access'
          assert access['walkingSpeedMetersPerMinute'] == 80
          assert access['streetDetourFactor'] == 1.25

          expected_bytes = access['rows'] * access['cols'] * 2
          idw_raw = Path('data/idw-grid.bin').read_bytes()
          access_raw = Path('data/access-grid.bin').read_bytes()
          assert len(idw_raw) == expected_bytes
          assert len(access_raw) == expected_bytes
          assert Path('data/idw-grid.bin.gz').stat().st_size > 0
          assert Path('data/access-grid.bin.gz').stat().st_size > 0

          # memoryview avoids allocating multi-million-element Python tuples. More
          # importantly, decode each grid once rather than once per station sample.
          idw_values = memoryview(idw_raw).cast('H')
          access_values = memoryview(access_raw).cast('H')
          valid = (v for v in access_values if v != access['nodata'])
          min_valid = min(valid)
          valid = (v for v in access_values if v != access['nodata'])
          max_valid = max(valid)
          assert min_valid > 0, min_valid
          assert max_valid < 65534, max_valid

          def decode(v, meta):
              return v / meta['scale'] - meta['offsetMinutes']

          def sample(values, meta, lat, lng):
              row = (meta['north'] - lat) / meta['latStep']
              col = (lng - meta['west']) / meta['lngStep']
              r0 = max(0, min(meta['rows'] - 2, math.floor(row)))
              c0 = max(0, min(meta['cols'] - 2, math.floor(col)))
              fr = max(0.0, min(1.0, row - r0)); fc = max(0.0, min(1.0, col - c0))
              i = r0 * meta['cols'] + c0
              v00, v10 = values[i], values[i + 1]
              v01, v11 = values[i + meta['cols']], values[i + meta['cols'] + 1]
              top = v00 + (v10 - v00) * fc
              bottom = v01 + (v11 - v01) * fc
              return decode(top + (bottom - top) * fr, meta)

          idw_school = sample(idw_values, idw, school['lat'], school['lng'])
          access_school = sample(access_values, access, school['lat'], school['lng'])
          assert abs(idw_school - 498) < 0.05, idw_school
          assert abs(access_school - 498) < 0.05, access_school

          errors = []
          for s in stations_doc['stations']:
              errors.append((sample(access_values, access, float(s['lat']), float(s['lng'])) - float(s['minutes']), s['station'], s['id']))
          abs_errors = [abs(e[0]) for e in errors]

          print('stationDataSha256', station_sha)
          print('interpolationAnchorDataSha256', anchor_sha)
          print('samples', idw['sampleCount'])
          print('grid', idw['rows'], idw['cols'])
          print('school IDW/access', idw_school, access_school)
          print('access effective straight-line speed', access['effectiveStraightLineSpeedMetersPerMinute'], 'm/min')
          print('access decoded range', decode(min_valid, access), decode(max_valid, access))
          print('station anchor error median/max abs', statistics.median(abs_errors), max(abs_errors))
          print('largest station-anchor differences')
          for e, name, sid in sorted(errors, key=lambda x: abs(x[0]), reverse=True)[:10]:
              print(f'  {sid} {name}: {e:+.2f} min')
          PY
      - name: Validate JavaScript syntax
        run: |
          node --check scripts/build_precomputed_grid.mjs
          node --check scripts/build_access_grid.mjs
          node --check js/config.js
          node --check js/precomputed-grid.js
          node --check js/main.js
          node --check js/markers.js
          node --check js/ui.js
