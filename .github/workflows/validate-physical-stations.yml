name: Validate physical station dataset

on:
  pull_request:
    branches: [main]
    paths:
      - data/stations.json
      - data/idw-grid.bin
      - data/idw-grid.bin.gz
      - data/idw-grid.meta.json
      - data/physical-idw-exclusion-audit-compact.json
      - scripts/prepare_physical_station_points.py
      - scripts/validate_physical_station_dataset.py
      - scripts/apply_physical_idw_exclusions.py
      - scripts/build_physical_station_dataset.py
      - scripts/build_precomputed_grid.mjs
      - js/config.js
      - js/main.js
      - js/markers.js
      - js/ui.js
      - index.html
      - .github/workflows/validate-physical-stations.yml
  push:
    branches: [main, recalc-idw-physical-exclusions]
    paths:
      - data/stations.json
      - data/idw-grid.bin
      - data/idw-grid.bin.gz
      - data/idw-grid.meta.json
      - data/physical-idw-exclusion-audit-compact.json
      - scripts/prepare_physical_station_points.py
      - scripts/validate_physical_station_dataset.py
      - scripts/apply_physical_idw_exclusions.py
      - scripts/build_physical_station_dataset.py
      - scripts/build_precomputed_grid.mjs
      - js/config.js
      - js/main.js
      - js/markers.js
      - js/ui.js
      - index.html
      - .github/workflows/validate-physical-stations.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild physical-point proposal from current dataset
        run: python scripts/prepare_physical_station_points.py
      - name: Validate station model and exclusion evidence
        run: python scripts/validate_physical_station_dataset.py
      - name: Validate IDW metadata and station hash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          stations_path = Path('data/stations.json')
          doc = json.loads(stations_path.read_text(encoding='utf-8'))
          grid = json.loads(Path('data/idw-grid.meta.json').read_text(encoding='utf-8'))
          sha = hashlib.sha256(stations_path.read_bytes()).hexdigest()
          excluded = sum(bool(s.get('excludeFromIdw')) for s in doc['stations'])
          included = len(doc['stations']) - excluded
          assert len(doc['stations']) == 1563
          assert grid['sourceStationCount'] == 1563
          assert grid['stationCount'] == included, (grid['stationCount'], included)
          assert grid['excludedStationCount'] == excluded, (grid['excludedStationCount'], excluded)
          assert sorted(grid['excludedStationIds']) == sorted(s['id'] for s in doc['stations'] if s.get('excludeFromIdw'))
          assert grid['stationDataSha256'] == sha, (grid['stationDataSha256'], sha)
          print('stationDataSha256', sha)
          print('grid', grid['rows'], grid['cols'], 'included', included, 'excluded', excluded)
          PY
      - name: Validate JavaScript syntax
        run: |
          node --check js/config.js
          node --check js/main.js
          node --check js/markers.js
          node --check js/ui.js
