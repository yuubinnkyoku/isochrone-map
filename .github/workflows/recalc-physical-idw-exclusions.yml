name: Recalculate physical IDW exclusions

on:
  push:
    branches: [recalc-idw-physical-exclusions]
    paths:
      - scripts/audit_physical_idw_exclusions.py
      - scripts/combine_physical_idw_exclusions.py
      - .github/workflows/recalc-physical-idw-exclusions.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild physical-point proposal
        run: python scripts/prepare_physical_station_points.py >/dev/null
      - name: Audit direct-vs-unrestricted routes
        run: |
          python scripts/audit_physical_idw_exclusions.py \
            --shard-index ${{ matrix.shard }} \
            --shard-count 4 \
            --delay-seconds 0.55 \
            --output data/physical-idw-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-idw-shard-${{ matrix.shard }}
          path: data/physical-idw-shard-${{ matrix.shard }}.json

  combine:
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: physical-idw-shard-*
          path: data/physical-idw-shards
          merge-multiple: true
      - name: Combine audit
        run: |
          python scripts/combine_physical_idw_exclusions.py \
            --input-dir data/physical-idw-shards \
            --json-output data/physical-idw-exclusion-audit.json \
            --markdown-output data/physical-idw-exclusion-audit.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-idw-exclusion-audit
          path: |
            data/physical-idw-exclusion-audit.json
            data/physical-idw-exclusion-audit.md
