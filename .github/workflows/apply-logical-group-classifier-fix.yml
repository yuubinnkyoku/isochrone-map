name: Apply logical-group classifier fix

on:
  push:
    branches: [deep-route-audit-round2]
    paths:
      - .github/workflows/apply-logical-group-classifier-fix.yml

permissions:
  contents: write

env:
  AUDIT_RUN_ID: '34202370240'

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch parser and builder
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/audit_physical_station_points_full.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'def classify_route1(point: dict, section: list[str]) -> dict:\n    """Classify a saved detailed route-1 section with the current parser."""',
              'def classify_route1(point: dict, section: list[str], logical_points: list[dict] | None = None) -> dict:\n    """Classify a saved detailed route-1 section with the current parser.\n\n    ``logical_points`` disambiguates distinct same-name stations: if Yahoo boards a\n    service that matches no physical component in the current logical station group,\n    the boarding point is a different station rather than a different component.\n    """',
              1,
          )
          old = '''    board = rail.get('boardStation')
              same_station = bool(board) and station_base(board) == station_base(point.get('logicalStation'))
              line_match, line_reason = line_matches_point(point, rail['service'])
              if same_station and line_match:
                  classification = 'keep'
                  reason = 'boards-current-physical-point'
              else:
                  classification = 'exclude'
                  if not same_station:
                      reason = 'boards-different-station'
                  else:
                      reason = 'boards-different-component'
          '''
          new = '''    board = rail.get('boardStation')
              same_station = bool(board) and station_base(board) == station_base(point.get('logicalStation'))
              line_match, line_reason = line_matches_point(point, rail['service'])
              same_logical_service_match = line_match
              if same_station and not line_match and logical_points:
                  same_logical_service_match = any(
                      line_matches_point(candidate, rail['service'])[0]
                      for candidate in logical_points
                  )
              if same_station and line_match:
                  classification = 'keep'
                  reason = 'boards-current-physical-point'
              elif same_station and same_logical_service_match:
                  classification = 'exclude'
                  reason = 'boards-different-component'
              else:
                  classification = 'exclude'
                  reason = 'boards-different-station'
          '''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace(
              'def classify(point: dict, excerpt: list[str]) -> dict:\n    """Classify where route 1 first boards rail; not whether the point enters IDW."""\n    return classify_route1(point, detailed_route1(excerpt))',
              'def classify(point: dict, excerpt: list[str], logical_points: list[dict] | None = None) -> dict:\n    """Classify where route 1 first boards rail; not whether the point enters IDW."""\n    return classify_route1(point, detailed_route1(excerpt), logical_points)',
              1,
          )
          old = '''    all_points = proposal['physicalPoints']
              selected = [
          '''
          new = '''    all_points = proposal['physicalPoints']
              logical_points_by_id = {}
              for candidate in all_points:
                  logical_points_by_id.setdefault(str(candidate.get('logicalStationId')), []).append(candidate)
              selected = [
          '''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace(
              "route_class = classify(point, result.get('excerpt') or [])",
              "route_class = classify(\n                point,\n                result.get('excerpt') or [],\n                logical_points_by_id.get(str(point.get('logicalStationId')), []),\n            )",
              1,
          )
          p.write_text(text, encoding='utf-8')

          p = Path('scripts/build_physical_station_dataset.py')
          text = p.read_text(encoding='utf-8')
          old = '''    reparsed: dict[str, dict] = {}
              legacy_parser_changes = 0
              for r in rows:
                  parsed = classify_route1(r, r.get('route1') or [])
          '''
          new = '''    reparse_groups: dict[str, list[dict]] = defaultdict(list)
              for r in rows:
                  reparse_groups[str(r['logicalStationId'])].append(r)

              reparsed: dict[str, dict] = {}
              legacy_parser_changes = 0
              for r in rows:
                  parsed = classify_route1(
                      r,
                      r.get('route1') or [],
                      reparse_groups[str(r['logicalStationId'])],
                  )
          '''
          assert old in text
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/audit_physical_station_points_full.py scripts/build_physical_station_dataset.py
      - uses: actions/download-artifact@v4
        with:
          name: physical-station-point-audit
          path: audit-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.AUDIT_RUN_ID }}
      - name: Verify Asakusa disambiguation and print counts
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path
          from audit_physical_station_points_full import classify_route1

          rows = json.loads(Path('audit-artifact/physical-station-point-audit.json').read_text(encoding='utf-8'))['rows']
          groups = defaultdict(list)
          for r in rows:
              groups[str(r['logicalStationId'])].append(r)
          counts = Counter()
          asakusa = None
          for r in rows:
              parsed = classify_route1(r, r.get('route1') or [], groups[str(r['logicalStationId'])])
              counts[parsed['reason']] += 1
              if r['id'] == 'n02p-003513':
                  asakusa = parsed
          print('COUNTS', dict(counts))
          print('ASAKUSA', asakusa)
          assert asakusa['reason'] == 'boards-different-station'
          PY
      - name: Commit parser fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit_physical_station_points_full.py scripts/build_physical_station_dataset.py
          git commit -m 'Disambiguate same-name separate boarding stations'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
