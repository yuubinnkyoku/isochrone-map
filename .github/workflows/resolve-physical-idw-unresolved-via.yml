name: Diagnose component routes via exact N02 adjacency

# Diagnostic only. N02 RailroadSection describes infrastructure topology, not a full
# passenger-service/stopping-pattern graph, so these results must not drive production
# IDW exclusions. Manual dispatch also avoids accidental high-volume Yahoo queries.
# The resolver itself remains conservative: every N02 adjacent direction must verify a
# route that demonstrably boards the current physical component; a no-route page is not
# impossibility evidence.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  INITIAL_RUN_ID: '34219625835'

jobs:
  adjacency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild physical-point proposal
        run: python scripts/prepare_physical_station_points.py >/dev/null
      - name: Derive exact N02 infrastructure-adjacent stations
        run: python scripts/build_n02_station_adjacency.py --output data/n02-station-adjacency.json
      - uses: actions/upload-artifact@v4
        with:
          name: n02-station-adjacency-for-idw
          path: data/n02-station-adjacency.json

  resolve:
    needs: adjacency
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild physical-point proposal
        run: python scripts/prepare_physical_station_points.py >/dev/null
      - name: Download exact N02 adjacency
        uses: actions/download-artifact@v4
        with:
          name: n02-station-adjacency-for-idw
          path: data
      - name: Download initial diagnostic shards
        uses: actions/download-artifact@v4
        with:
          pattern: physical-idw-shard-*
          path: data/initial-idw-shards
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.INITIAL_RUN_ID }}
      - name: Diagnose unresolved direct-component routes through every N02 adjacent station
        run: |
          python scripts/resolve_physical_idw_unresolved_via.py \
            --input-dir data/initial-idw-shards \
            --adjacency data/n02-station-adjacency.json \
            --shard-index ${{ matrix.shard }} \
            --shard-count 4 \
            --delay-seconds 0.55 \
            --output data/physical-idw-via-resolution-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-idw-via-resolution-${{ matrix.shard }}
          path: data/physical-idw-via-resolution-${{ matrix.shard }}.json

  combine:
    needs: [adjacency, resolve]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download initial diagnostic shards
        uses: actions/download-artifact@v4
        with:
          pattern: physical-idw-shard-*
          path: data/initial-idw-shards
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.INITIAL_RUN_ID }}
      - name: Download exact-adjacency diagnostic shards
        uses: actions/download-artifact@v4
        with:
          pattern: physical-idw-via-resolution-*
          path: data/via-resolution-shards
          merge-multiple: true
      - name: Overlay diagnostic resolutions and recompute summary
        run: |
          python scripts/merge_physical_idw_resolutions.py \
            --initial-dir data/initial-idw-shards \
            --resolution-dir data/via-resolution-shards \
            --json-output data/physical-idw-exclusion-audit-resolved.json \
            --markdown-output data/physical-idw-exclusion-audit-resolved.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-idw-exclusion-audit-resolved
          path: |
            data/physical-idw-exclusion-audit-resolved.json
            data/physical-idw-exclusion-audit-resolved.md
