name: Apply route line alias fixes

on:
  push:
    branches: [deep-route-audit-round2]
    paths:
      - .github/workflows/apply-route-line-alias-fixes.yml

permissions:
  contents: write

env:
  AUDIT_RUN_ID: '34202370240'

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch line/service mappings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/audit_route_origin_alignment.py')
          text = p.read_text(encoding='utf-8')
          old = '''SERVICE_LINE_OVERRIDES = {
              "musashikosugi": {
                  "成田エクスプレス": ["東海道線"],
              },
          }
          '''
          new = '''SERVICE_LINE_OVERRIDES = {
              "musashikosugi": {
                  "成田エクスプレス": ["東海道線"],
              },
              # N02 stores the shared/through-running infrastructure under a different
              # line name at these stations. Keep these station-specific so a broad
              # alias does not accidentally match a different physical component at a
              # large interchange.
              "motosumiyoshi": {"東急目黒線": ["東横線"]},
              "nishinippori": {"JR山手線": ["東北線"]},
              "nippori": {"JR山手線": ["東北線"]},
              "hamamatsucho": {"JR山手線": ["東海道線"]},
              "uguisudani": {"JR山手線": ["東北線"]},
              "tamachi": {"JR山手線": ["東海道線"]},
              "takanawa-gateway": {"JR山手線": ["東海道線"]},
              "tokyo23-003575": {"東京メトロ東西線": ["中央線"]},
              "tokyo23-003579": {"東京メトロ東西線": ["中央線"]},
              "tokyo23-003574": {"東京メトロ東西線": ["中央線"]},
              "tokyo23-003573": {"東京メトロ東西線": ["中央線"]},
              "n02-003584": {"東京メトロ東西線": ["中央線"]},
              "n02-003587": {"東京メトロ東西線": ["中央線"]},
              "n02-004675": {"JR横浜線": ["根岸線"]},
              "n02-003090": {"京成臨時ライナー": ["北総線", "成田空港線"]},
              "n02-003125": {"京成臨時ライナー": ["北総線", "成田空港線"]},
          }
          '''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace(
              '"JR埼京線": ["山手線", "赤羽線", "東北線"],',
              '"JR埼京線": ["山手線", "赤羽線", "東北線", "川越線"],',
              1,
          )
          marker = '"JR高崎線": ["高崎線", "東北線"],\n'
          assert marker in text
          text = text.replace(marker, marker + '    "JR武蔵野線": ["武蔵野線", "京葉線"],\n    "東京メトロ丸ノ内線": ["4号線丸ノ内線", "4号線丸ノ内線分岐線"],\n    "関東鉄道竜ケ崎線": ["竜ヶ崎線"],\n', 1)
          text = text.replace(
              '"小湊鐵道": ["小湊鉄道線"],',
              '"小湊鐵道": ["小湊鉄道線", "小湊鐵道線"],',
              1,
          )
          p.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/audit_route_origin_alignment.py scripts/audit_physical_station_points_full.py
      - uses: actions/download-artifact@v4
        with:
          name: physical-station-point-audit
          path: audit-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.AUDIT_RUN_ID }}
      - name: Re-run component mapping audit after fixes
        run: python scripts/audit_component_line_mapping.py --audit audit-artifact/physical-station-point-audit.json
      - name: Commit mapping fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit_route_origin_alignment.py
          git commit -m 'Fix remaining route-to-infrastructure mappings'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
