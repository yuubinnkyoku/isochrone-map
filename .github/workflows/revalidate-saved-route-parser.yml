name: Revalidate saved Yahoo route parsing

on:
  push:
    branches: [fix-route-parser-revalidation]
    paths:
      - scripts/audit_physical_station_points_full.py
      - scripts/build_physical_station_dataset.py
      - .github/workflows/revalidate-saved-route-parser.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  AUDIT_RUN_ID: '34202370240'
  LOGICAL_SOURCE_COMMIT: 'e7e95ab4117be8288606d2c4d4db90b674b37402'

jobs:
  revalidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preserve current generated dataset for comparison
        run: cp data/stations.json /tmp/stations-before-reparse.json

      - name: Materialize immutable logical station source
        run: |
          git show "${LOGICAL_SOURCE_COMMIT}:data/stations.json" > /tmp/logical-stations.json
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path('/tmp/logical-stations.json').read_text(encoding='utf-8'))
          assert len(doc['stations']) == 1318
          PY

      - name: Rebuild physical-point proposal
        run: |
          python scripts/prepare_physical_station_points.py \
            --stations /tmp/logical-stations.json \
            --output data/physical-station-points-proposal.json

      - name: Download original 1563-point Yahoo audit
        uses: actions/download-artifact@v4
        with:
          name: physical-station-point-audit
          path: audit-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.AUDIT_RUN_ID }}

      - name: Reparse all saved raw routes and rebuild station dataset
        run: |
          python scripts/build_physical_station_dataset.py \
            --old-stations /tmp/logical-stations.json \
            --audit audit-artifact/physical-station-point-audit.json \
            --output data/stations.json \
            --compact-audit-output data/physical-station-point-audit-compact.json

      - name: Validate parser coverage and corrected examples
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path('/tmp/stations-before-reparse.json').read_text(encoding='utf-8'))
          after = json.loads(Path('data/stations.json').read_text(encoding='utf-8'))
          raw = json.loads(Path('audit-artifact/physical-station-point-audit.json').read_text(encoding='utf-8'))

          assert len(after['stations']) == 1563
          assert len(raw['rows']) == 1563
          assert all(not s.get('excludeFromIdw') for s in after['stations'])
          assert all(s.get('route') for s in after['stations'])

          diag = after['meta']['idwExclusionPolicy']['exactPointAudit']['routeSelectionDiagnostics']
          assert sum(diag.values()) == 1563, diag
          assert after['meta']['idwExclusionPolicy']['exactPointAudit']['routeParserVersion'] == 2
          reparsed = after['meta']['idwExclusionPolicy']['exactPointAudit']['savedAuditRowsReclassified']
          assert reparsed > 0

          by_id = {s['id']: s for s in after['stations']}
          urawa = by_id['n02p-002933']
          first = urawa['physicalPointAudit']['firstRail']
          assert urawa['station'] == '浦和美園'
          assert urawa['departureDisplay'] == '07:12'
          assert urawa['line'] == '埼玉高速鉄道線'
          assert first['boardStation'] == '浦和美園', first
          assert '埼玉高速鉄道' in first['service'], first
          assert first['sameLogicalStationBase'] is True
          assert first['lineMatchesPhysicalPoint'] is True
          assert urawa['physicalPointAudit']['reason'] == 'boards-current-physical-point'
          assert '埼玉高速鉄道' in urawa['route']
          assert '東京メトロ丸ノ内線池袋行' in urawa['route']

          # Orthographic Yahoo/N02 variants must not create fake different-station flags.
          for sid in ('n02p-003945', 'n02p-004024', 'n02p-003279', 'n02p-003289', 'n02p-003671'):
              s = by_id[sid]
              assert s['physicalPointAudit']['reason'] == 'boards-current-physical-point', (sid, s['physicalPointAudit'])

          # Every stored first-rail service must also appear in the human route summary.
          for s in after['stations']:
              first = (s.get('physicalPointAudit') or {}).get('firstRail') or {}
              service = first.get('service')
              if service:
                  assert service in s['route'], (s['id'], service, s['route'])

          before_by_id = {s['id']: s for s in before['stations']}
          route_changes = 0
          diagnostic_changes = 0
          for s in after['stations']:
              old = before_by_id[s['id']]
              if old.get('route') != s.get('route'):
                  route_changes += 1
              if old.get('physicalPointAudit') != s.get('physicalPointAudit'):
                  diagnostic_changes += 1

          print('routeSelectionDiagnostics', diag)
          print('savedAuditRowsReclassified', reparsed)
          print('stored route summaries changed', route_changes)
          print('stored route diagnostics changed', diagnostic_changes)
          print('浦和美園 route', urawa['route'])
          print('浦和美園 first rail', first)
          PY

      - name: Rebuild interpolation grids because stations.json provenance changed
        run: |
          node scripts/build_precomputed_grid.mjs
          node scripts/build_access_grid.mjs

      - name: Run repository validation
        run: |
          python scripts/validate_physical_station_dataset.py
          node --check scripts/audit_physical_station_points_full.py
          node --check scripts/build_precomputed_grid.mjs
          node --check scripts/build_access_grid.mjs
          node --check js/config.js
          node --check js/main.js
          node --check js/markers.js
          node --check js/ui.js

      - name: Commit reparsed dataset and grids
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stations.json data/physical-station-point-audit-compact.json \
            data/idw-grid.bin data/idw-grid.bin.gz data/idw-grid.meta.json \
            data/access-grid.bin data/access-grid.bin.gz data/access-grid.meta.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Reparse all 1563 saved Yahoo routes'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
