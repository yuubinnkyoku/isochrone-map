name: Apply route semantic wrap

on:
  push:
    branches: [fix-route-semantic-wrap]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-route-semantic-wrap
          fetch-depth: 0
      - name: Patch route tooltip wrapping
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('js/markers.js')
          s = p.read_text()
          old = (
              "        if (s.route) {\n"
              "          var routeParts = String(s.route).split(' → ');\n"
              "          var routeLines = [];\n"
              "          for (var routeIndex = 0; routeIndex < routeParts.length; routeIndex += 2) {\n"
              "            var routeLine = routeParts.slice(routeIndex, routeIndex + 2).join(' → ');\n"
              "            if (routeIndex > 0) routeLine = '→ ' + routeLine;\n"
              "            routeLines.push(routeLine);\n"
              "          }\n"
              "          routeHtml = '<div class=\"tt-line tt-route\">' + routeLines.join('<br>') + '</div>';\n"
              "        }\n"
          )
          new = (
              "        if (s.route) {\n"
              "          var routeParts = String(s.route).split(' → ');\n"
              "          var routeLines = [];\n"
              "          for (var routeIndex = 0; routeIndex < routeParts.length; routeIndex += 2) {\n"
              "            var prefix = routeIndex > 0 ? '→ ' : '';\n"
              "            var routeFrom = routeParts[routeIndex];\n"
              "            var routeTo = routeParts[routeIndex + 1];\n"
              "            if (routeTo === undefined) {\n"
              "              routeLines.push(prefix + routeFrom);\n"
              "              continue;\n"
              "            }\n"
              "\n"
              "            var pairedLine = prefix + routeFrom + ' → ' + routeTo;\n"
              "            if (pairedLine.length <= 24) {\n"
              "              routeLines.push(pairedLine);\n"
              "            } else {\n"
              "              routeLines.push(prefix + routeFrom);\n"
              "              routeLines.push('→ ' + routeTo);\n"
              "            }\n"
              "          }\n"
              "          routeHtml = '<div class=\"tt-line tt-route\">' + routeLines.map(function (line) {\n"
              "            return '<span class=\"tt-route-line\">' + line + '</span>';\n"
              "          }).join('') + '</div>';\n"
              "        }\n"
          )
          if old not in s:
              raise SystemExit('markers.js target block not found')
          p.write_text(s.replace(old, new))

          p = Path('css/style.css')
          s = p.read_text()
          old = (
              ".tt-route {\n"
              "  max-width: min(360px, calc(100vw - 48px));\n"
              "  white-space: normal;\n"
              "  overflow-wrap: anywhere;\n"
              "  line-height: 1.65;\n"
              "}\n"
          )
          new = (
              ".tt-route {\n"
              "  white-space: normal;\n"
              "  overflow-wrap: normal;\n"
              "  word-break: keep-all;\n"
              "  line-height: 1.65;\n"
              "  font-size: 10px;\n"
              "}\n"
              "\n"
              ".tt-route-line {\n"
              "  display: block;\n"
              "  white-space: nowrap;\n"
              "  overflow-wrap: normal;\n"
              "  word-break: keep-all;\n"
              "}\n"
          )
          if old not in s:
              raise SystemExit('style.css target block not found')
          p.write_text(s.replace(old, new))

          p = Path('index.html')
          s = p.read_text()
          s = s.replace('css/style.css?v=4', 'css/style.css?v=5')
          s = s.replace('js/markers.js?v=18', 'js/markers.js?v=19')
          p.write_text(s)
          PY

          node --check js/markers.js
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/markers.js css/style.css index.html
          git commit -m 'Prevent mid-name route tooltip wrapping'
          git push origin HEAD:fix-route-semantic-wrap
