name: Apply route semantic wrap

on:
  push:
    branches: [fix-route-semantic-wrap]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-route-semantic-wrap
          fetch-depth: 0
      - name: Use semantic arrow-boundary wrapping
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('js/markers.js')
          s = p.read_text()
          old = (
              "        if (s.route) {\n"
              "          var routeParts = String(s.route).split(' → ');\n"
              "          var routeLines = [];\n"
              "          for (var routeIndex = 0; routeIndex < routeParts.length; routeIndex += 2) {\n"
              "            var prefix = routeIndex > 0 ? '→ ' : '';\n"
              "            var routeFrom = routeParts[routeIndex];\n"
              "            var routeTo = routeParts[routeIndex + 1];\n"
              "            if (routeTo === undefined) {\n"
              "              routeLines.push(prefix + routeFrom);\n"
              "              continue;\n"
              "            }\n"
              "\n"
              "            var pairedLine = prefix + routeFrom + ' → ' + routeTo;\n"
              "            if (pairedLine.length <= 24) {\n"
              "              routeLines.push(pairedLine);\n"
              "            } else {\n"
              "              routeLines.push(prefix + routeFrom);\n"
              "              routeLines.push('→ ' + routeTo);\n"
              "            }\n"
              "          }\n"
              "          routeHtml = '<div class=\"tt-line tt-route\">' + routeLines.map(function (line) {\n"
              "            return '<span class=\"tt-route-line\">' + line + '</span>';\n"
              "          }).join('') + '</div>';\n"
              "        }\n"
          )
          new = (
              "        if (s.route) {\n"
              "          var routeParts = String(s.route).split(' → ');\n"
              "          var routeLines = [];\n"
              "          var routeLine = routeParts[0] || '';\n"
              "          for (var routeIndex = 1; routeIndex < routeParts.length; routeIndex++) {\n"
              "            var candidateLine = routeLine + ' → ' + routeParts[routeIndex];\n"
              "            if (candidateLine.length <= 24) {\n"
              "              routeLine = candidateLine;\n"
              "            } else {\n"
              "              routeLines.push(routeLine);\n"
              "              routeLine = '→ ' + routeParts[routeIndex];\n"
              "            }\n"
              "          }\n"
              "          if (routeLine) routeLines.push(routeLine);\n"
              "          routeHtml = '<div class=\"tt-line tt-route\">' + routeLines.map(function (line) {\n"
              "            return '<span class=\"tt-route-line\">' + line + '</span>';\n"
              "          }).join('') + '</div>';\n"
              "        }\n"
          )
          if old not in s:
              raise SystemExit('current route wrapping block not found')
          p.write_text(s.replace(old, new))

          p = Path('index.html')
          s = p.read_text().replace('js/markers.js?v=19', 'js/markers.js?v=20')
          p.write_text(s)
          PY

          node --check js/markers.js
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/markers.js index.html
          git commit -m 'Wrap routes only at arrow boundaries'
          git push origin HEAD:fix-route-semantic-wrap
