name: Deep route parser audit round 2

on:
  push:
    branches: [deep-route-audit-round2]
    paths:
      - scripts/audit_route_parser_round2.py
      - .github/workflows/audit-route-parser-round2.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  AUDIT_RUN_ID: '34202370240'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download original Yahoo audit artifact
        uses: actions/download-artifact@v4
        with:
          name: physical-station-point-audit
          path: audit-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.AUDIT_RUN_ID }}
      - name: Run deep parser audit
        run: |
          python scripts/audit_route_parser_round2.py \
            --audit audit-artifact/physical-station-point-audit.json \
            --stations data/stations.json \
            --output route-parser-round2-report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: route-parser-round2-report
          path: route-parser-round2-report.json
