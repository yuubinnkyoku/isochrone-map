name: Probe physical flatlon routes

on:
  push:
    branches: [physical-station-points-recalc]
    paths:
      - scripts/probe_physical_flatlon_routes.py
      - .github/workflows/probe-physical-flatlon-routes.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python scripts/prepare_physical_station_points.py >/dev/null
          python scripts/probe_physical_flatlon_routes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-flatlon-route-probe
          path: data/physical-flatlon-route-probe.json
