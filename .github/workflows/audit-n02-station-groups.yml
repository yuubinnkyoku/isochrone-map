name: Audit N02 station groups

on:
  push:
    branches:
      - audit-n02-station-groups
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile audit scripts
        run: |
          python -m py_compile scripts/audit_n02_station_groups.py
          python -m py_compile scripts/audit_n02_coverage.py
          python -m py_compile scripts/audit_route_anchor_candidates.py
          python -m py_compile scripts/audit_route_origin_alignment.py
          python -m py_compile scripts/audit_same_name_station_routes.py
          python -m py_compile scripts/audit_unparsed_route_members.py
          python -m py_compile scripts/audit_yahoo_targeted.py
      - name: Run N02 station-group audit
        run: python scripts/audit_n02_station_groups.py
      - name: Prove N02 50km coverage
        run: python scripts/audit_n02_coverage.py
      - name: Inspect ambiguous route anchors
        run: python scripts/audit_route_anchor_candidates.py
      - name: Audit all route origins
        run: python scripts/audit_route_origin_alignment.py
      - name: Audit unresolved route members
        run: python scripts/audit_unparsed_route_members.py
      - name: Audit same-name route resolution
        run: python scripts/audit_same_name_station_routes.py
      - name: Query targeted Yahoo routes
        continue-on-error: true
        run: python scripts/audit_yahoo_targeted.py
      - name: Show report summaries
        if: always()
        run: |
          sed -n '1,220p' data/n02-station-group-audit.md || true
          echo '--- coverage ---'
          cat data/n02-coverage-audit.md || true
          echo '--- route-origin alignment ---'
          cat data/route-origin-alignment-audit.md || true
          echo '--- same-name route resolution ---'
          cat data/same-name-station-route-audit.md || true
          echo '--- targeted Yahoo ---'
          cat data/yahoo-targeted-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n02-station-group-audit
          path: |
            data/n02-station-group-audit.json
            data/n02-station-group-audit.md
            data/n02-coverage-audit.json
            data/n02-coverage-audit.md
            data/route-anchor-candidates.json
            data/route-origin-alignment-audit.json
            data/route-origin-alignment-audit.md
            data/unparsed-route-members.json
            data/same-name-station-route-audit.json
            data/same-name-station-route-audit.md
            data/yahoo-targeted-audit.json
