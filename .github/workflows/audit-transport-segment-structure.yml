name: Audit Yahoo transport segment structure

on:
  push:
    branches: [deep-route-audit-round2]
    paths:
      - scripts/audit_transport_segment_structure.py
      - .github/workflows/audit-transport-segment-structure.yml

permissions:
  contents: read

env:
  AUDIT_RUN_ID: '34202370240'

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: physical-station-point-audit
          path: audit-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.AUDIT_RUN_ID }}
      - name: Audit all platform-linked service labels
        env:
          PYTHONPATH: scripts
        run: python scripts/audit_transport_segment_structure.py --audit audit-artifact/physical-station-point-audit.json
