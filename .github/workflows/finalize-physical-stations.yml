name: Finalize physical station dataset

# Manual reproducible rebuild from the pinned complete exact-point Yahoo audit.
# Direct-vs-component audits are diagnostic only: IDW represents accessibility from a
# coordinate, so every verified exact-point optimum remains a spatial sample.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  ACCESS_AUDIT_RUN_ID: '34202370240'
  # Last main commit whose data/stations.json is the immutable 1318-row logical source.
  LOGICAL_SOURCE_COMMIT: 'e7e95ab4117be8288606d2c4d4db90b674b37402'

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require a branch ref
        run: test "${GITHUB_REF_TYPE}" = "branch"

      - name: Materialize immutable logical station source
        run: |
          git show "${LOGICAL_SOURCE_COMMIT}:data/stations.json" > /tmp/logical-stations.json
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path('/tmp/logical-stations.json').read_text(encoding='utf-8'))
          assert len(doc['stations']) == 1318, len(doc['stations'])
          assert not any(s.get('logicalStationId') for s in doc['stations'])
          print('logical source stations', len(doc['stations']))
          PY

      - name: Rebuild N02 physical point proposal
        run: |
          python scripts/prepare_physical_station_points.py \
            --stations /tmp/logical-stations.json \
            --output data/physical-station-points-proposal.json

      - name: Download complete 1563-point exact-point accessibility audit
        uses: actions/download-artifact@v4
        with:
          name: physical-station-point-audit
          path: access-audit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ACCESS_AUDIT_RUN_ID }}

      - name: Build all 1563 exact-point accessibility samples
        run: |
          python scripts/build_physical_station_dataset.py \
            --old-stations /tmp/logical-stations.json \
            --audit access-audit/physical-station-point-audit.json \
            --output data/stations.json \
            --compact-audit-output data/physical-station-point-audit-compact.json

      - name: Enforce exact-point IDW semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path('data/stations.json').read_text(encoding='utf-8'))
          policy = doc['meta']['idwExclusionPolicy']
          assert len(doc['stations']) == 1563
          assert policy['auditedPhysicalPoints'] == 1563, policy
          assert policy['exactPointAudit']['originVerified'] == 1563, policy
          assert policy['includedPhysicalPoints'] == 1563, policy
          assert policy['excludedPhysicalPoints'] == 0, policy
          assert policy['excludedStations'] == 0, policy
          assert not any(s.get('excludeFromIdw') for s in doc['stations'])
          print('all 1563 verified coordinate-accessibility samples retained for IDW')
          PY

      - name: Rebuild IDW grid from all verified physical points
        run: node scripts/build_precomputed_grid.mjs

      - name: Validate generated data, grid and frontend syntax
        run: |
          python scripts/validate_physical_station_dataset.py
          node --check js/config.js
          node --check js/main.js
          node --check js/markers.js
          node --check js/ui.js
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          stations_path = Path('data/stations.json')
          meta = json.loads(Path('data/idw-grid.meta.json').read_text(encoding='utf-8'))
          sha = hashlib.sha256(stations_path.read_bytes()).hexdigest()
          assert meta['sourceStationCount'] == 1563, meta
          assert meta['stationCount'] == 1563, meta
          assert meta['excludedStationCount'] == 0, meta
          assert not meta['excludedStationIds'], meta
          assert meta['stationDataSha256'] == sha, (meta['stationDataSha256'], sha)
          print('stationDataSha256', sha)
          print('grid', meta['rows'], meta['cols'], 'included', meta['stationCount'], 'excluded', meta['excludedStationCount'])
          PY

      - name: Commit generated dataset and grid
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stations.json data/physical-station-point-audit-compact.json \
            data/idw-grid.bin data/idw-grid.bin.gz data/idw-grid.meta.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Rebuild all 1563 exact-point accessibility samples'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
