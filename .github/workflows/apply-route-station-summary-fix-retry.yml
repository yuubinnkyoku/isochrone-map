name: Apply route station summary fix retry

on:
  push:
    branches: [fix-route-station-summary-work]
    paths:
      - .github/workflows/apply-route-station-summary-fix-retry.yml

permissions:
  contents: write

env:
  AUDIT_RUN_ID: '34202370240'
  LOGICAL_SOURCE_COMMIT: 'e7e95ab4117be8288606d2c4d4db90b674b37402'

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch source, validator and cache versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          builder = Path('scripts/build_physical_station_dataset.py')
          text = builder.read_text(encoding='utf-8')
          new_block = r'''def _is_route_clock_label(value: str) -> bool:
              return bool(re.fullmatch(r'\(?\d{1,2}:\d{2}(?:着|発)?\)?', value.strip()))


          def _is_route_station_event(section: list[str], index: int) -> bool:
              """Identify boarding/alighting/transfer station or bus-stop lines."""
              if index <= 0:
                  return False
              line = str(section[index]).strip()
              if not line:
                  return False
              if _is_route_clock_label(line) or is_bus_service(line) or is_rail_service(line):
                  return False
              if line in {'発', '着', '早', '楽', '安', '地図', '出口', '時刻表'}:
                  return False
              if line.startswith('徒歩'):
                  return False
              if line.startswith(('出口：', '乗車位置：', 'IC優先', '乗換：', '定期の種類', '[発]', '[着]')):
                  return False
              if re.fullmatch(r'\d+駅', line) or re.fullmatch(r'[\d,]+円', line) or re.fullmatch(r'\d+(?:\.\d+)?km', line):
                  return False
              previous = str(section[index - 1]).strip()
              if _is_route_clock_label(previous):
                  return True
              return previous in {'発', '着'} and index >= 2 and _is_route_clock_label(str(section[index - 2]).strip())


          def route_summary(section: list[str]) -> str:
              """Build a transfer chain that retains station/stop names as well as modes."""
              parts = []
              for i, raw in enumerate(section):
                  line = str(raw).strip()
                  if not line:
                      continue
                  if _is_route_station_event(section, i):
                      if '物理駅地点-' not in line:
                          parts.append(line)
                  elif re.fullmatch(r'徒歩\d+分', line) or is_bus_service(line) or is_rail_service(line):
                      parts.append(line)
              out = []
              for part in parts:
                  if not out or out[-1] != part:
                      out.append(part)
              return ' → '.join(out)


          def line_display'''
          pattern = r'def route_summary\(section: list\[str\]\) -> str:\n.*?\n\ndef line_display'
          text, count = re.subn(pattern, lambda _: new_block, text, flags=re.S)
          assert count == 1, count
          text = text.replace(
              "            'routeParserVersion': 3,\n            'savedAuditRowsReclassified': legacy_parser_changes,",
              "            'routeParserVersion': 3,\n            'routeSummaryVersion': 2,\n            'savedAuditRowsReclassified': legacy_parser_changes,", 1)
          text = text.replace(
              "        'routeParserVersion': 3,\n        'savedAuditRowsReclassified': legacy_parser_changes,",
              "        'routeParserVersion': 3,\n        'routeSummaryVersion': 2,\n        'savedAuditRowsReclassified': legacy_parser_changes,", 1)
          builder.write_text(text, encoding='utf-8')

          validator = Path('scripts/validate_physical_station_dataset.py')
          text = validator.read_text(encoding='utf-8')
          old = "    if exact.get('routeParserVersion') != 3:\n        raise SystemExit(f\"route parser version {exact.get('routeParserVersion')} != 3\")\n"
          new = old + "    if exact.get('routeSummaryVersion') != 2:\n        raise SystemExit(f\"route summary version {exact.get('routeSummaryVersion')} != 2\")\n"
          assert old in text
          text = text.replace(old, new, 1)
          marker = "    # Every parsed first-rail service must be present in the human-readable route too.\n"
          insert = '''    # Route summaries must retain transfer station/stop names, not just service names.\n    required_urawa_route_tokens = [\n        '浦和美園', '埼玉高速鉄道', '後楽園', '東京メトロ丸ノ内線',\n        '茗荷谷', '筑波大学附属高等学校',\n    ]\n    urawa_route = urawa.get('route', '')\n    positions = []\n    for token in required_urawa_route_tokens:\n        pos = urawa_route.find(token)\n        if pos < 0:\n            raise SystemExit(f'浦和美園 route summary missing {token}: {urawa_route}')\n        positions.append(pos)\n    if positions != sorted(positions):\n        raise SystemExit(f'浦和美園 route summary order broken: {urawa_route}')\n\n    for station in stations:\n        route = station.get('route', '')\n        if '筑波大学附属高等学校' not in route:\n            raise SystemExit(f\"route destination missing: {station['id']} {route}\")\n        first = (station.get('physicalPointAudit') or {}).get('firstRail') or {}\n        if first.get('service') and route.count(' → ') < 2:\n            raise SystemExit(f\"route station chain missing: {station['id']} {route}\")\n\n'''
          assert marker in text
          text = text.replace(marker, insert + marker, 1)
          validator.write_text(text, encoding='utf-8')

          config = Path('js/config.js')
          text = config.read_text(encoding='utf-8')
          for old, new in [('dataVersion: 24,','dataVersion: 25,'),('gridVersion: 13,','gridVersion: 14,'),('accessGridVersion: 4,','accessGridVersion: 5,')]:
              assert old in text
              text = text.replace(old, new, 1)
          config.write_text(text, encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          assert 'js/config.js?v=29' in text
          index.write_text(text.replace('js/config.js?v=29', 'js/config.js?v=30', 1), encoding='utf-8')
          PY
      - name: Materialize immutable logical source and proposal
        run: |
          git show "${LOGICAL_SOURCE_COMMIT}:data/stations.json" > /tmp/logical-stations.json
          python scripts/prepare_physical_station_points.py --stations /tmp/logical-stations.json --output data/physical-station-points-proposal.json
      - name: Download saved Yahoo audit
        uses: actions/download-artifact@v4
        with:
          name: physical-station-point-audit
          path: audit-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.AUDIT_RUN_ID }}
      - name: Rebuild dataset and interpolation grids
        run: |
          python scripts/build_physical_station_dataset.py --old-stations /tmp/logical-stations.json --audit audit-artifact/physical-station-point-audit.json --output data/stations.json --compact-audit-output data/physical-station-point-audit-compact.json
          node scripts/build_precomputed_grid.mjs
          node scripts/build_access_grid.mjs
      - name: Validate all route summaries
        run: |
          python scripts/validate_physical_station_dataset.py
          node --check js/config.js
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('data/stations.json').read_text(encoding='utf-8'))
          assert len(doc['stations']) == 1563
          assert all('筑波大学附属高等学校' in s['route'] for s in doc['stations'])
          urawa=next(s for s in doc['stations'] if s['id']=='n02p-002933')
          expected='徒歩1分 → 浦和美園 → 埼玉高速鉄道当駅始発武蔵小杉行 → 後楽園 → 東京メトロ丸ノ内線池袋行 → 茗荷谷 → 徒歩8分 → 筑波大学附属高等学校'
          assert urawa['route']==expected, urawa['route']
          print(urawa['route'])
          PY
      - name: Commit generated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-route-station-summary-fix.yml .github/workflows/apply-route-station-summary-fix-retry.yml
          git add scripts/build_physical_station_dataset.py scripts/validate_physical_station_dataset.py js/config.js index.html data/stations.json data/physical-station-point-audit-compact.json data/idw-grid.bin data/idw-grid.bin.gz data/idw-grid.meta.json data/access-grid.bin data/access-grid.bin.gz data/access-grid.meta.json
          git commit -m 'Include stations and stops in route summaries'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
