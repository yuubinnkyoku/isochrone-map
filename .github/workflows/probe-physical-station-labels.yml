name: Probe physical station labels

on:
  push:
    branches:
      - physical-station-points-recalc
    paths:
      - scripts/probe_physical_station_labels.py
      - .github/workflows/probe-physical-station-labels.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m py_compile scripts/prepare_physical_station_points.py scripts/probe_physical_station_labels.py
          python scripts/prepare_physical_station_points.py >/dev/null
          python scripts/probe_physical_station_labels.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-station-label-probe
          path: data/physical-station-label-probe.json
