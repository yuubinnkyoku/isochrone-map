name: Full Yahoo flatlon station audit

on:
  push:
    branches:
      - audit-n02-station-groups
    paths:
      - scripts/audit_yahoo_flatlon_full.py
      - scripts/combine_yahoo_flatlon_audit.py
      - .github/workflows/audit-yahoo-flatlon-full.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile scripts
        run: |
          python -m py_compile scripts/audit_address_origin_resolution.py
          python -m py_compile scripts/audit_yahoo_flatlon_full.py
          python -m py_compile scripts/combine_yahoo_flatlon_audit.py
      - name: Audit exact station points
        run: |
          python scripts/audit_yahoo_flatlon_full.py \
            --shard-index ${{ matrix.shard }} \
            --shard-count 4 \
            --delay-seconds 0.55 \
            --output data/flatlon-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flatlon-shard-${{ matrix.shard }}
          path: data/flatlon-shard-${{ matrix.shard }}.json

  combine:
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: flatlon-shard-*
          path: data/flatlon-shards
          merge-multiple: true
      - name: Combine shard reports
        run: |
          python scripts/combine_yahoo_flatlon_audit.py \
            --input-dir data/flatlon-shards \
            --json-output data/yahoo-flatlon-full-audit.json \
            --markdown-output data/yahoo-flatlon-full-audit.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yahoo-flatlon-full-audit
          path: |
            data/yahoo-flatlon-full-audit.json
            data/yahoo-flatlon-full-audit.md
