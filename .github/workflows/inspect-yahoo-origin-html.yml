name: Inspect Yahoo origin HTML

on:
  push:
    branches: [recalc-idw-physical-exclusions]
    paths:
      - scripts/inspect_yahoo_origin_html.py
      - .github/workflows/inspect-yahoo-origin-html.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/inspect_yahoo_origin_html.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yahoo-origin-html-diagnostic
          path: data/yahoo-origin-html-diagnostic.json
