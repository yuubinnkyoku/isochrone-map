name: Verify new Yahoo flatlon candidates

on:
  push:
    branches:
      - audit-n02-station-groups
    paths:
      - scripts/audit_yahoo_flatlon_new_candidates.py
      - .github/workflows/audit-yahoo-flatlon-new-candidates.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: |
          python -m py_compile scripts/audit_address_origin_resolution.py
          python -m py_compile scripts/audit_yahoo_flatlon_new_candidates.py
      - name: Verify 24 new candidates
        run: python scripts/audit_yahoo_flatlon_new_candidates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yahoo-flatlon-new-candidates
          path: data/yahoo-flatlon-new-candidates.json
