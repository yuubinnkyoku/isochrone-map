<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>筑附高 08:20 等時線マップ</title>
  <meta name="description" content="筑波大学附属高等学校の1限開始（08:20）に間に合う最遅出発時刻を等時線マップで可視化">

  <!-- OGP / Twitter Card Meta Tags -->
  <meta property="og:title" content="筑附高 08:20 等時線マップ">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yuubinnkyoku.github.io/isochrone-map/">
  <meta property="og:description" content="筑波大学附属高等学校の1限開始（08:20）に間に合う最遅出発時刻を等時線マップで可視化">
  <meta property="og:site_name" content="筑附高 08:20 等時線マップ">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="筑附高 08:20 等時線マップ">
  <meta name="twitter:description" content="筑波大学附属高等学校の1限開始（08:20）に間に合う最遅出発時刻を等時線マップで可視化">
  <meta property="og:locale" content="ja_JP">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

<div class="title-bar">
  <h1>筑附高 <span class="accent">08:20</span> 等時線マップ</h1>
  <div class="subtitle">isochrone map — 1限開始に間に合う最遅出発時刻</div>
  <div class="search-container">
    <input type="text" id="station-search" list="station-list" placeholder="駅を検索..." autocomplete="off">
    <datalist id="station-list"></datalist>
  </div>
</div>

<button class="btn-settings" id="btn-settings" aria-label="設定">&#9881;</button>

<div class="settings-panel" id="settings-panel">
  <div class="ctrl-section">
    <div class="ctrl-title">テーマ</div>
    <label class="ctrl-row">
      <input type="checkbox" id="toggle-theme">
      <span class="ctrl-toggle"></span>
      <span class="ctrl-label">ダークモード</span>
    </label>
  </div>

  <div class="ctrl-section">
    <div class="ctrl-title">地図タイル</div>
    <div class="ctrl-select">
      <select id="select-tile">
        <option value="gsi-pale">国土地理院 淡色</option>
        <option value="gsi-std">国土地理院 標準</option>
        <option value="osm-jp">OpenStreetMap JP</option>
        <option value="gsi-dark">国土地理院 ダーク</option>
      </select>
    </div>
  </div>

  <div class="ctrl-section">
    <div class="ctrl-title">表示設定</div>
    <label class="ctrl-row">
      <input type="checkbox" id="toggle-3d">
      <span class="ctrl-toggle"></span>
      <span class="ctrl-label">3D表示</span>
    </label>
    <div class="ctrl-select" id="3d-mapmode-row" style="display:none">
      <span class="ctrl-label">地図</span>
      <select id="select-3d-mapmode">
        <option value="texture">貼り付け</option>
        <option value="flat">平面</option>
      </select>
    </div>
    <div class="ctrl-select" id="3d-flat-height-row" style="display:none">
      <span class="ctrl-label">平面高さ</span>
      <input type="range" id="range-3d-flat-height" min="-5" max="110" step="1">
      <span class="ctrl-value" id="label-3d-flat-height">+4</span>
    </div>
    <label class="ctrl-row">
      <input type="checkbox" id="toggle-contour" checked>
      <span class="ctrl-toggle"></span>
      <span class="ctrl-label">等時線</span>
    </label>
    <div class="ctrl-select" id="interval-row">
      <span class="ctrl-label">間隔</span>
      <select id="select-interval">
        <option value="3">3分</option>
        <option value="5" selected>5分</option>
        <option value="10">10分</option>
      </select>
    </div>
    <label class="ctrl-row">
      <input type="checkbox" id="toggle-gradient">
      <span class="ctrl-toggle"></span>
      <span class="ctrl-label">グラデーション</span>
    </label>
    <label class="ctrl-row">
      <input type="checkbox" id="toggle-labels" checked>
      <span class="ctrl-toggle"></span>
      <span class="ctrl-label">駅名ラベル</span>
    </label>
    <div class="ctrl-select">
      <span class="ctrl-label">補間対象外駅</span>
      <select id="select-excluded-stations">
        <option value="highlight">強調</option>
        <option value="hollow" selected>中抜き</option>
        <option value="hidden">表示しない</option>
      </select>
    </div>
    <label class="ctrl-row">
      <input type="checkbox" id="toggle-legend" checked>
      <span class="ctrl-toggle"></span>
      <span class="ctrl-label">凡例</span>
    </label>
    <label class="ctrl-row">
      <input type="checkbox" id="toggle-radius-rings">
      <span class="ctrl-toggle"></span>
      <span class="ctrl-label">半径5・10・15・20・30・40・50km円</span>
    </label>
  </div>

  <div class="ctrl-section">
    <div class="ctrl-title">データ情報</div>
    <div class="ctrl-info" id="data-info">読み込み中...</div>
    <button class="btn-devtools" id="btn-devtools">開発者ツール</button>
  </div>
</div>

<div class="legend" id="legend">
  <div class="legend-title" id="legend-title">出発時刻（5分刻み等時線）</div>
  <div class="legend-lines" id="legend-lines"></div>
  <div class="legend-gradient-bar" id="legend-grad"></div>
  <div class="legend-gradient-labels" id="legend-grad-labels"></div>
  <div class="legend-excluded" id="legend-excluded"></div>
</div>

<div id="canvas-3d"></div>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/config.js?v=24"></script>
<script src="js/data.js?v=13"></script>
<script src="js/precomputed-grid.js?v=2"></script>
<script src="js/map.js?v=9"></script>
<script src="js/renderer.js?v=14"></script>
<script src="js/renderer3d.js?v=15"></script>
<script src="js/markers.js?v=14"></script>
<script src="js/ui.js?v=15"></script>
<script src="js/main.js?v=15"></script>
<script src="js/devtools.js?v=11"></script>
</body>
</html>
